name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ticket-booking-nestjs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ticket-booking-nestjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ticket-frontend-nestjs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ticket-frontend-nestjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker-config:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ticket_booking
          REDIS_PASSWORD: ci_redis_password
          ML_API_KEY: ci_ml_api_key
          JWT_SECRET: ci_jwt_secret
          QR_SECRET: ci_qr_secret
          PAYPAL_CLIENT_ID: ci_paypal_client_id
          PAYPAL_CLIENT_SECRET: ci_paypal_client_secret
          PAYPAL_WEBHOOK_ID: ci_paypal_webhook_id
          MUX_TOKEN_ID: ci_mux_token_id
          MUX_TOKEN_SECRET: ci_mux_token_secret
          NEXT_PUBLIC_WS_URL: ws://localhost:3001
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci_stripe_publishable_key
          NEXT_PUBLIC_OAUTH2_BASE_URL: http://localhost:3001/auth
        run: docker compose config --quiet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ml-service:
    build: ./ml-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticket_booking
      API_KEY: ${ML_API_KEY:-dev-ml-api-key}
      HOST: 0.0.0.0
      PORT: "8000"
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./ticket-booking-nestjs
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      APP_PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticket_booking
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: http://localhost:3000
      APP_FRONTEND_URL: http://localhost:3000
      ML_SERVICE_URL: http://ml-service:8000/api/ml
      ML_API_KEY: ${ML_API_KEY:-dev-ml-api-key}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./ticket-frontend-nestjs
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      - backend

volumes:
  pgdata:
